services:
  - type: web
    name: kozlogon-server
    runtime: node
    repo: https://github.com/blumbutta/kozlogon
    branch: main
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: node --check server/index.mjs
    startCommand: npm run start:server
    healthCheckPath: /health
    autoDeployTrigger: commit
    disk:
      name: integrals-data
      mountPath: /var/data/integrals
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: INTEGRALS_DB_PATH
        value: /var/data/integrals/game.sqlite
